<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Soul Animation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <canvas id="soul-canvas"></canvas>
    <script src="https://unpkg.com/ogl@0.0.32/dist/ogl.umd.js"></script>
    <script>
      const fragmentShader = `precision mediump float;
          uniform float uTime;
          uniform vec2 uPlaneResolution;
          uniform float uScale;
          uniform vec2 uMouse;

          varying vec2 vUv;
          varying vec3 vPosition;

          // Based on the shader by Panteleymonov A K https://www.shadertoy.com/view/4lfSzS
          // License Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported License.

          // Panteleymonov A K 2015

          // animated noise
          vec4 NC0 = vec4(0.0, 157.0, 113.0, 270.0);
          vec4 NC1 = vec4(1.0, 158.0, 114.0, 271.0);
          vec4 WS = vec4(0.25, 0.25, 0.25, 0.25);

          // mix noise for alive animation, full source
          vec4 hash4(vec4 n) {
            return fract(sin(n) * 1399763.5453123);
          }

          vec3 hash3(vec3 n) {
            return fract(sin(n) * 1399763.5453123);
          }

          vec3 hpos(vec3 n) {
            return hash3(
              vec3(
                dot(n, vec3(157.0, 113.0, 271.0)),
                dot(n, vec3(271.0, 157.0, 113.0)),
                dot(n, vec3(113.0, 271.0, 157.0))
              )
            );
          }

          float noise4q(vec4 x) {
            vec4 n3 = vec4(0, 0.25, 0.5, 0.75);
            vec4 p2 = floor(x.wwww + n3);
            vec4 b =
              floor(x.xxxx + n3) +
              floor(x.yyyy + n3) * 157.0 +
              floor(x.zzzz + n3) * 113.0;
            vec4 p1 =
              b + fract(p2 * 0.00390625) * vec4(164352.0, -164352.0, 163840.0, -163840.0);
            p2 =
              b +
              fract((p2 + 1.0) * 0.00390625) *
                vec4(164352.0, -164352.0, 163840.0, -163840.0);
            vec4 f1 = fract(x.xxxx + n3);
            vec4 f2 = fract(x.yyyy + n3);
            f1 = f1 * f1 * (3.0 - 2.0 * f1);
            f2 = f2 * f2 * (3.0 - 2.0 * f2);
            vec4 n1 = vec4(0, 1.0, 157.0, 158.0);
            vec4 n2 = vec4(113.0, 114.0, 270.0, 271.0);
            vec4 vs1 = mix(hash4(p1), hash4(n1.yyyy + p1), f1);
            vec4 vs2 = mix(hash4(n1.zzzz + p1), hash4(n1.wwww + p1), f1);
            vec4 vs3 = mix(hash4(p2), hash4(n1.yyyy + p2), f1);
            vec4 vs4 = mix(hash4(n1.zzzz + p2), hash4(n1.wwww + p2), f1);
            vs1 = mix(vs1, vs2, f2);
            vs3 = mix(vs3, vs4, f2);
            vs2 = mix(hash4(n2.xxxx + p1), hash4(n2.yyyy + p1), f1);
            vs4 = mix(hash4(n2.zzzz + p1), hash4(n2.wwww + p1), f1);
            vs2 = mix(vs2, vs4, f2);
            vs4 = mix(hash4(n2.xxxx + p2), hash4(n2.yyyy + p2), f1);
            vec4 vs5 = mix(hash4(n2.zzzz + p2), hash4(n2.wwww + p2), f1);
            vs4 = mix(vs4, vs5, f2);
            f1 = fract(x.zzzz + n3);
            f2 = fract(x.wwww + n3);
            f1 = f1 * f1 * (3.0 - 2.0 * f1);
            f2 = f2 * f2 * (3.0 - 2.0 * f2);
            vs1 = mix(vs1, vs2, f1);
            vs3 = mix(vs3, vs4, f1);
            vs1 = mix(vs1, vs3, f2);
            float r = dot(vs1, vec4(0.25));
            //  r=r*r*(3.0-2.0*r);
            return r * r * (3.0 - 2.0 * r);
          }

          // body of a star
          float noiseSpere(
            vec3 ray,
            vec3 pos,
            float r,
            mat3 mr,
            float zoom,
            vec3 subnoise,
            float anim
          ) {
            float b = dot(ray, pos);
            float c = dot(pos, pos) - b * b;

            vec3 r1 = vec3(0.0);

            float s = 0.0;
            float d = 0.03125;
            float d2 = zoom / (d * d);
            float ar = 5.0;

            for (int i = 0; i < 3; i++) {
              float rq = r * r;
              if (c < rq) {
                float l1 = sqrt(rq - c);
                r1 = ray * (b - l1) - pos;
                r1 = r1 * mr;
                s += abs(noise4q(vec4(r1 * d2 + subnoise * ar, anim * ar)) * d);
              }
              ar -= 2.0;
              d *= 4.0;
              d2 *= 0.0625;
              r = r - r * 0.02;
            }
            return s;
          }

          // glow ring
          float ring(vec3 ray, vec3 pos, float r, float size) {
            float b = dot(ray, pos);
            float c = dot(pos, pos) - b * b;

            float s = max(0.0, 1.0 - size * abs(r - sqrt(c)));

            return s;
          }

          // rays of a star
          float ringRayNoise(
            vec3 ray,
            vec3 pos,
            float r,
            float size,
            mat3 mr,
            float anim
          ) {
            float b = dot(ray, pos);
            vec3 pr = ray * b - pos;

            float c = length(pr);

            pr *= mr;

            pr = normalize(pr);

            float s = max(0.0, 1.0 - size * abs(r - c));

            float nd = noise4q(vec4(pr * 1.0, -anim + c)) * 2.0;
            nd = pow(nd, 2.0);
            float n = 0.4;
            float ns = 1.0;
            float resolutionMultiplier = pow(uPlaneResolution.x / 110.0, 0.45);
            if (c > r) {
              n = noise4q(vec4(pr * 1.0, -anim + c));
              ns =
                noise4q(vec4(pr * 10.0 * resolutionMultiplier, -anim * 2.5 + c * 2.0)) *
                1.0;
            }
            n = n * n * nd * ns;

            return pow(s, 2.0 * resolutionMultiplier) + s * s * n;
          }

          vec4 noiseSpace(
            vec3 ray,
            vec3 pos,
            float r,
            mat3 mr,
            float zoom,
            vec3 subnoise,
            float anim
          ) {
            float b = dot(ray, pos);
            float c = dot(pos, pos) - b * b;

            vec3 r1 = vec3(0.0);

            float s = 0.0;
            float d = 0.0625 * 1.5;
            float d2 = zoom / d;

            float rq = r * r;
            float l1 = sqrt(abs(rq - c));
            r1 = (ray * (b - l1) - pos) * mr;

            r1 *= d2;
            s += abs(noise4q(vec4(r1 + subnoise, anim)) * d);
            s += abs(noise4q(vec4(r1 * 0.5 + subnoise, anim)) * d * 2.0);
            s += abs(noise4q(vec4(r1 * 0.25 + subnoise, anim)) * d * 4.0);
            //return s;
            return vec4(
              s * 2.0,
              abs(noise4q(vec4(r1 * 0.1 + subnoise, anim))),
              abs(noise4q(vec4(r1 * 0.1 + subnoise * 6.0, anim))),
              abs(noise4q(vec4(r1 * 0.1 + subnoise * 13.0, anim)))
            );
          }

          float sphereZero(vec3 ray, vec3 pos, float r) {
            float b = dot(ray, pos);
            float c = dot(pos, pos) - b * b;
            float s = 1.0;
            if (c < r * r) s = 0.0;
            return s;
          }

          void main() {
            vec3 iResolution = vec3(1.0, 1.0, 1.0);
            vec2 fragCoord = vUv;
            float planeDefaultWidth = 120.0;

            vec2 p = (-iResolution.xy + 2.0 * fragCoord.xy) / iResolution.y;

            float time = uTime * 1.0;

            vec3 iMouse = vec3(vec2(uMouse), 1.0);
            float mx =
              iMouse.z > 0.0
                ? iMouse.x / iResolution.x * 0.5 - time * 0.085
                : time * 0.125;
            float my =
              iMouse.z > 0.0
                ? iMouse.y / iResolution.y * 0.3 + time * 0.095
                : -0.6;
            vec2 rotate = vec2(mx, my);

            vec2 sins = sin(rotate);
            vec2 coss = cos(rotate);
            mat3 mr = mat3(
              vec3(coss.x, 0.0, sins.x),
              vec3(0.0, 1.0, 0.0),
              vec3(-sins.x, 0.0, coss.x)
            );
            mr =
              mat3(
                vec3(1.0, 0.0, 0.0),
                vec3(0.0, coss.y, sins.y),
                vec3(0.0, -sins.y, coss.y)
              ) *
              mr;

            mat3 imr = mat3(
              vec3(coss.x, 0.0, -sins.x),
              vec3(0.0, 1.0, 0.0),
              vec3(sins.x, 0.0, coss.x)
            );
            imr =
              imr *
              mat3(
                vec3(1.0, 0.0, 0.0),
                vec3(0.0, coss.y, -sins.y),
                vec3(0.0, sins.y, coss.y)
              );

            vec3 ray = normalize(vec3(p, 2.0));
            vec3 pos = vec3(0.0, 0.0, 3.0 / uScale);

            float s1 = noiseSpere(ray, pos, 0.9, mr, 0.5, vec3(0.0), time);
            s1 = pow(min(1.0, s1 * 2.4), 2.0);
            float s2 = noiseSpere(
              ray,
              pos,
              0.9,
              mr,
              2.0 /
                clamp(pow(5.0, 1.0 - planeDefaultWidth / uPlaneResolution.x), 0.7, 5.0),
              vec3(83.23, 34.34, 67.453),
              time * 1.2
            );
            s2 = min(1.0, s2 * 2.2);
            gl_FragColor = vec4(
              mix(vec3(0.0, 0.5, 1.0), vec3(1.0), pow(s1, 60.0)) * s1,
              1.0
            );
            gl_FragColor += vec4(
              mix(
                mix(vec3(0.0, 0.0, 1.0), vec3(0.0, 0.5, 1.0), pow(s1, 2.0)),
                vec3(1.0),
                pow(s2, 10.0)
              ) *
                s2,
              1.0
            );

            gl_FragColor.rgb -= 0.1;

            gl_FragColor = max(vec4(0.0), gl_FragColor);

            float s3 = ringRayNoise(ray, pos, 0.86, 1.1, mr, time);
            gl_FragColor.rgb += pow(s3, 0.5) * s3;

            float alpha = pow(s3, 2.0) + s2 + s1 * 1.0;
            gl_FragColor.w = alpha;

            gl_FragColor.rgb -= 0.2;

            float zero = sphereZero(ray, pos, 0.9);

            gl_FragColor = max(vec4(0.0), gl_FragColor);
            gl_FragColor = min(vec4(1.0), gl_FragColor);
          }
          `
      const vertexShader = `precision mediump float;
        attribute vec2 uv;
        attribute vec3 position;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;

        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec2 vUv;

        uniform float uTime;
        uniform vec3 uPosition;

        void main() {
          vUv = uv;
          vPosition = position;

          vec3 pos = position;

          pos += uPosition;

          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
        `

      const { Renderer, Camera, Transform, Plane, Program, Mesh, Vec2, Vec3 } = ogl // ✅ lowercase

      class SoulAnimation {
        canvas
        canvasWidth
        canvasHeight
        soulSize

        isPlaying
        mousemoveListener = () => {}
        mouseX
        mouseY

        scene
        gl
        plane = null
        camera
        renderer
        uniforms
        cameraDistance

        maxFPS

        constructor(canvas, canvasWidth, canvasHeight, soulSize) {
          this.canvas = canvas
          this.canvasWidth = canvasWidth
          this.canvasHeight = canvasHeight
          this.soulSize = soulSize

          this.isPlaying = true
          this.maxFPS = 66
          this.cameraDistance = 600

          this.mouseX = 0
          this.mouseY = 0

          // OGL setup
          this.renderer = new Renderer({ canvas: this.canvas, alpha: true })
          this.gl = this.renderer.gl

          this.scene = new Transform()

          this.camera = new Camera(this.gl, {
            fov: this.getCameraFovMappedToPixels(),
            far: 10000,
          })
          this.camera.position.set(0, 0, this.cameraDistance)

          this.uniforms = {
            uTime: { value: 0.0 },
            uPlaneResolution: { value: new Vec2(this.soulSize, this.soulSize) },
            uPosition: { value: new Vec3(0.0, 0.0, 0.0) },
            uScale: { value: 1.0 },
            uMouse: { value: new Vec2(0.0, 0.0) },
          }

          this.initSceneObjects()
          this.updateSceneParams()
          this.initListeners()
          this.render()
        }

        initListeners() {
          this.mousemoveListener = (ev) => {
            this.mouseX = ev.clientX / window.innerWidth
            this.mouseY = ev.clientY / window.innerHeight
          }
          window.addEventListener('mousemove', this.mousemoveListener)
        }

        updateSceneParams() {
          this.renderer.dpr = this.getDevicePixelRatio()
          this.renderer.setSize(this.canvasWidth, this.canvasHeight)
          this.camera.perspective({
            aspect: this.getCameraAspectRatio(),
          })
        }

        getCameraFovMappedToPixels() {
          return 2 * Math.atan(Math.max(this.canvasWidth, this.canvasHeight) / 2 / this.cameraDistance) * (180 / Math.PI)
        }

        getDevicePixelRatio() {
          if (this.detectIsSlowDevice()) {
            return 1
          }
          return Math.min(2, window.devicePixelRatio)
        }

        detectIsSlowDevice() {
          if (typeof navigator === 'undefined') {
            return true
          }
          // @ts-expect-error navigator.deviceMemory is available only in some supporting browsers
          return navigator.deviceMemory <= 2 || navigator.hardwareConcurrency <= 2
        }

        getCameraAspectRatio() {
          return this.canvasWidth / this.canvasHeight
        }

        initSceneObjects() {
          this.plane = this.createPlane()
          this.plane.setParent(this.scene)
        }

        createPlane() {
          const geometry = new Plane(this.gl, {
            width: this.soulSize,
            height: this.soulSize,
            attributes: {
              position: {
                size: 3,
                data: new Float32Array([-1, -1, 0, 1, -1, 0, -1, 1, 0, 1, 1, 0]),
              },
              uv: {
                size: 2,
                data: new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]),
              },
            },
          })

          const program = new Program(this.gl, {
            vertex: vertexShader,
            fragment: fragmentShader,
            uniforms: this.uniforms,
            transparent: true,
          })

          const plane = new Mesh(this.gl, { geometry, program })
          plane.position.set(0, 0, 0)

          return plane
        }

        render() {
          let lastFrameTime = 0
          const minFrameTime = 1000 / this.maxFPS

          const newFrame = (frameTime) => {
            if (!this.isPlaying) return
            requestAnimationFrame(newFrame)

            if (frameTime - lastFrameTime < minFrameTime) {
              return
            }
            lastFrameTime = frameTime

            this.uniforms.uMouse.value.x = this.mouseX
            this.uniforms.uMouse.value.y = this.mouseY
            this.uniforms.uTime.value = frameTime / 1000

            this.renderer.render({ scene: this.scene, camera: this.camera })
          }
          requestAnimationFrame(newFrame)
        }

        destroy() {
          this.isPlaying = false
          window.removeEventListener('mousemove', this.mousemoveListener)
        }
      }

      const canvas = document.getElementById('soul-canvas')
      canvas.width = 400
      canvas.height = 400

      new SoulAnimation(canvas, 400, 400, 200)
    </script>
  </body>
</html>
